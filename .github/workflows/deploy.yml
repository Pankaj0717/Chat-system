name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./HHLD-Chat-App/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-backend:latest

      - name: Build and push auth-backend
        uses: docker/build-push-action@v5
        with:
          context: ./HHLD-Chat-App/auth-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-auth-backend:lts

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./HHLD-Chat-App/client
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.35-174-198-179.nip.io
            NEXT_PUBLIC_AUTH_URL=https://auth.35-174-198-179.nip.io
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-client:lts

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/myapp
            docker compose pull
            docker compose up -d
            docker image prune -f