version: '3.8'

services:
 backend:
   image: gaonkarpankaj/chat-backend:latest
   ports:
     - "8080:8080"


 backend2:
   image: gaonkarpankaj/chat-backend2:lts
   
   ports:
     - "8084:8080"


 auth-backend:
   image: gaonkarpankaj/chat-auth-backend:lts
   
   ports:
     - "8081:8081" 


 frontend:
   image: gaonkarpankaj/chat-client:lts
  
   ports:
     - "3000:3000"
   depends_on:
     - backend # Wait for backend service to be ready before starting frontend


 frontend2:
   image: gaonkarpankaj/chat-client2:lts
   
   ports:
     - "3001:3000"
   depends_on:
     - backend # Wait for backend service to be ready before starting frontend



